<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 146" width="900" height="146" role="img" aria-label="2026 Hackathons Overview and Timeline">
  <defs>
    <linearGradient id="hackSurf-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafaf9"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="trackGrad-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#15803d" stop-opacity="0.7"/>
      <stop offset="55%" stop-color="#0369a1" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="898" height="144" rx="12" fill="url(#hackSurf-light)" stroke="#dcdcd8" stroke-width="1.2"/>
  <line x1="16" y1="1.5" x2="884" y2="1.5" stroke="#ffffff" stroke-width="1" opacity="0.45"/>

  <rect x="22" y="22" width="4" height="58" rx="2" fill="#b45309"/>
  <text x="40" y="42" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19.5" font-weight="700" fill="#0c0c0e">2026 Hackathon Track Record</text>
  <text x="40" y="72" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" fill="#3f3f46">Shipped prototypes under time constraints — participations only, judging pending.</text>
  <rect x="600" y="22" width="84.0" height="26" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/><text x="642.0" y="39.1" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="600" fill="#b45309">7 EVENTS</text>
  <rect x="692" y="22" width="78.0" height="26" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/><text x="731.0" y="39.1" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="600" fill="#15803d">6 REPOS</text>
  <rect x="778" y="22" width="98.0" height="26" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1"/><text x="827.0" y="39.1" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="600" fill="#0369a1">ROCm CERT</text>

  <!-- Subtle Timeline Track -->
  <line x1="44" y1="112" x2="846" y2="112" stroke="#bdbdb7" stroke-width="2"/>
  <line x1="44" y1="112" x2="846" y2="112" stroke="url(#trackGrad-light)" stroke-width="2" opacity="0.55"/>
  <circle cx="44" cy="112" r="3.5" fill="#b45309">
    <animate attributeName="cx" values="44;846;846" keyTimes="0;0.75;1" dur="7.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.72;0.82" dur="7.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="44" cy="112" r="4.5" fill="#ffffff" stroke="#15803d" stroke-width="2"/><text x="44" y="131" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="600" fill="#686870">Meta</text><circle cx="174" cy="112" r="4.5" fill="#ffffff" stroke="#15803d" stroke-width="2"/><text x="174" y="131" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="600" fill="#686870">Codegeist</text><circle cx="316" cy="112" r="4.5" fill="#ffffff" stroke="#15803d" stroke-width="2"/><text x="316" y="131" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="600" fill="#686870">QNX 8</text><circle cx="448" cy="112" r="4.5" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/><text x="448" y="131" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="600" fill="#686870">PayPal AI</text><circle cx="580" cy="112" r="4.5" fill="#ffffff" stroke="#0369a1" stroke-width="2"/><text x="580" y="131" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="600" fill="#686870">Vultr</text><circle cx="706" cy="112" r="4.5" fill="#ffffff" stroke="#b45309" stroke-width="2"/><text x="706" y="131" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="600" fill="#686870">UGREEN</text><circle cx="846" cy="112" r="4.5" fill="#ffffff" stroke="#b45309" stroke-width="2"/><text x="846" y="131" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="600" fill="#686870">AMD AI</text>
</svg>
