<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 146" width="900" height="146" role="img" aria-label="2026 Hackathons Overview and Timeline" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
