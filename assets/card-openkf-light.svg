<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 248" width="440" height="248" role="img" aria-label="OpenKF — Native 64-bit Killing Floor client">
  <title>OpenKF</title>
  <defs>
    <linearGradient id="cardSurf-light-openkf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafaf9"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="topGlow-light-openkf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309" stop-opacity="0"/>
      <stop offset="50%" stop-color="#b45309" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#15803d" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cClip-light-openkf">
      <rect x="1" y="1" width="438" height="246" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cClip-light-openkf)">
    <rect x="0" y="0" width="440" height="248" fill="url(#cardSurf-light-openkf)"/>
    <!-- Subtle top-edge traveling highlight -->
    <rect x="-120" y="0" width="140" height="2.4" fill="url(#topGlow-light-openkf)">
      <animateTransform attributeName="transform" type="translate" values="0 0;580 0;580 0" keyTimes="0;0.38;1" dur="9.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="1" y="1" width="438" height="246" rx="12" fill="none" stroke="#dcdcd8" stroke-width="1.2"/>
  <line x1="16" y1="1.5" x2="424" y2="1.5" stroke="#ffffff" stroke-width="1" opacity="0.45"/>

  <text x="22" y="38" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="-0.3" fill="#0c0c0e">OpenKF</text>
  <g transform="translate(313.5, 18)">
    <rect x="0" y="0" width="104.5" height="24" rx="6" fill="#f1f1ef" stroke="#dcdcd8" stroke-width="1"/><text x="52.2" y="16.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="600" fill="#3f3f46">v1065 CLIENT</text>
  </g>

  <circle cx="27" cy="59" r="4" fill="#dea584"/>
  <text x="37" y="63" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#3f3f46">Rust / Vulkan · GPL-3.0</text>

  <g transform="translate(368, 54)" opacity="0.9">
      <rect x="0" y="14" width="6" height="8" rx="1.5" fill="#bdbdb7"/>
      <rect x="10" y="10" width="6" height="12" rx="1.5" fill="#bdbdb7"/>
      <rect x="20" y="6" width="6" height="16" rx="1.5" fill="#b45309" opacity="0.75"/>
      <rect x="30" y="1" width="6" height="21" rx="1.5" fill="#b45309">
        <animate attributeName="opacity" values="1;0.55;1" dur="2.8s" repeatCount="indefinite"/>
      </rect>
    </g>

  <text x="22" y="95" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#b45309">Native 64-bit Killing Floor client</text>

  <text x="22" y="122" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#3f3f46">Implements retail protocol, Steam auth</text>
  <text x="22" y="142" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#3f3f46">&amp; multi-threaded Vulkan rendering.</text>
  <text x="22" y="162" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#3f3f46">Requires your own licensed game copy.</text>

  <line x1="22" y1="188" x2="418" y2="188" stroke="#dcdcd8" stroke-width="1"/>
  <circle cx="28" cy="216" r="3.5" fill="#b45309"/>
  <text x="39" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="500" fill="#3f3f46">671 fps headless · 0.14s load</text>

  <g transform="translate(312.6, 204)">
    <rect x="0" y="0" width="105.4" height="24" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/><circle cx="12" cy="12.0" r="3.2" fill="#b45309"><animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></circle><text x="20.0" y="16.0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="600" fill="#b45309">BENCHMARKED</text>
  </g>
</svg>
