<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 326" width="900" height="326" role="img" aria-label="MSDOS10 — Independent Systems and Applied AI Engineer">
  <title>MSDOS10 — Systems &amp; Applied AI</title>
  <defs>
    
    <pattern id="dots-dark" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" fill="#26262e"/>
    </pattern>
    <radialGradient id="glowA-dark" cx="0.84" cy="0.20" r="0.48">
      <stop offset="0%" stop-color="#ffb224" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffb224" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB-dark" cx="0.68" cy="0.88" r="0.45">
      <stop offset="0%" stop-color="#3ecf8e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3ecf8e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeGrid-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="45%" stop-color="white" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="white" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask-dark">
      <rect x="0" y="0" width="900" height="326" fill="url(#fadeGrid-dark)"/>
    </mask>
    <clipPath id="cardClip-dark">
      <rect x="1" y="1" width="898" height="324" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip-dark)">
    <rect x="0" y="0" width="900" height="326" fill="#09090b"/>
    <rect x="0" y="0" width="900" height="326" fill="url(#dots-dark)" mask="url(#gridMask-dark)"/>
    <rect x="0" y="0" width="900" height="326" fill="url(#glowA-dark)"/>
    <rect x="0" y="0" width="900" height="326" fill="url(#glowB-dark)"/>
  </g>
  <rect x="1" y="1" width="898" height="324" rx="14" fill="none" stroke="#27272a" stroke-width="1.2"/>

  <!-- Top Left Brand + Status -->
  <g transform="translate(36, 32)">
    <rect x="0" y="0" width="38" height="38" rx="9" fill="#17171b" stroke="#3f3f46" stroke-width="1"/>
    <path d="M9 28V10h4.2L19 18.6 24.8 10H29v18h-4.1V17.1L20.1 24h-2.2l-4.8-6.9V28Z" fill="#ededef"/>
    <rect x="29.5" y="23.5" width="4.5" height="4.5" rx="1" fill="#ffb224">
      <animate attributeName="opacity" values="1;1;0.15;1" keyTimes="0;0.55;0.7;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>

    <text x="50" y="15" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0.4" fill="#ededef">MSDOS10</text>
    <circle cx="55" cy="30.5" r="4" fill="#3ecf8e">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="66" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="600" letter-spacing="0.5" fill="#b4b4bd">SYSTEMS &amp; APPLIED AI ENGINEER</text>
  </g>

  <!-- Main Headline -->
  <text x="36" y="136" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-1" fill="#ededef">Software that holds up</text>
  <text x="36" y="182" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-1" fill="#82828d">on real machines.</text>

  <!-- Lead Copy -->
  <text x="36" y="218" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" fill="#b4b4bd">Cross-device automation, applied AI behind deterministic</text>
  <text x="36" y="240" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" fill="#b4b4bd">gates, and native systems with reproducible benchmarks.</text>

  <!-- Bottom Pills -->
  <rect x="36" y="266" width="162.0" height="26" rx="6" fill="#0b2419" stroke="#196143" stroke-width="1"/><text x="117.0" y="283.1" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="600" fill="#3ecf8e">2,576+ commits / 12m</text>
  <rect x="206" y="266" width="146.0" height="26" rx="6" fill="#261c0b" stroke="#6b490e" stroke-width="1"/><text x="279.0" y="283.1" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="600" fill="#ffb224">7 Hackathons 2026</text>
  <rect x="360" y="266" width="152.0" height="26" rx="6" fill="#17171b" stroke="#3f3f46" stroke-width="1"/><text x="436.0" y="283.1" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="600" fill="#b4b4bd">AMD ROCm Associate</text>

  <!-- Right Floating Telemetry Terminal Card -->
  <g transform="translate(534, 34)">
    <rect x="0" y="0" width="332" height="256" rx="12" fill="#111114" stroke="#3f3f46" stroke-width="1"/>
    <rect x="0" y="0" width="332" height="34" rx="12" fill="#17171b"/>
    <rect x="0" y="22" width="332" height="12" fill="#17171b"/>
    <line x1="0" y1="34" x2="332" y2="34" stroke="#27272a" stroke-width="1"/>
    <circle cx="16" cy="17" r="4" fill="#3f3f46"/>
    <circle cx="29" cy="17" r="4" fill="#3f3f46"/>
    <circle cx="42" cy="17" r="4" fill="#3f3f46"/>
    <text x="60" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#82828d">C:\&gt; profile.exe --verify</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="12.5">
      <text x="18" y="62" fill="#82828d">$ verify --scope=prod</text>

      <text x="18" y="94" fill="#ffb224">01</text>
      <text x="40" y="94" fill="#ededef">model.propose()</text>
      <rect x="206" y="79" width="110" height="21" rx="5" fill="#17171b" stroke="#27272a"/>
      <text x="261" y="93.5" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b4b4bd">ADVISORY</text>

      <text x="18" y="126" fill="#ffb224">02</text>
      <text x="40" y="126" fill="#ededef">gate.validate()</text>
      <rect x="206" y="111" width="110" height="21" rx="5" fill="#261c0b" stroke="#6b490e"/>
      <text x="261" y="125.5" text-anchor="middle" font-size="10.5" font-weight="600" fill="#ffb224">DETERMINISTIC</text>

      <text x="18" y="158" fill="#ffb224">03</text>
      <text x="40" y="158" fill="#ededef">hw.readback()</text>
      <rect x="206" y="143" width="110" height="21" rx="5" fill="#0b2419" stroke="#196143"/>
      <text x="261" y="157.5" text-anchor="middle" font-size="10.5" font-weight="600" fill="#3ecf8e">37/37 HW LOG</text>

      <line x1="18" y1="182" x2="314" y2="182" stroke="#27272a" stroke-width="1"/>
      <text x="18" y="206" font-size="11.5" fill="#b4b4bd">revision-pinned · limits noted</text>

      <circle cx="23" cy="232" r="4" fill="#3ecf8e"/>
      <text x="35" y="236" font-size="12" font-weight="700" fill="#3ecf8e">EXIT 0x00 // VERIFIED</text>
      <rect x="202" y="224" width="8" height="14" rx="1.5" fill="#ffb224">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.48;0.5;0.98;1" dur="1.3s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
