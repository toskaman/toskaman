<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 248" width="440" height="248" role="img" aria-label="OpenBridge — Multi-transport device automation">
  <title>OpenBridge</title>
  <defs>
    <linearGradient id="cardSurf-light-openbridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafaf9"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="topGlow-light-openbridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309" stop-opacity="0"/>
      <stop offset="50%" stop-color="#b45309" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#15803d" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cClip-light-openbridge">
      <rect x="1" y="1" width="438" height="246" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cClip-light-openbridge)">
    <rect x="0" y="0" width="440" height="248" fill="url(#cardSurf-light-openbridge)"/>
    <!-- Subtle top-edge traveling highlight -->
    <rect x="-120" y="0" width="140" height="2.4" fill="url(#topGlow-light-openbridge)">
      <animateTransform attributeName="transform" type="translate" values="0 0;580 0;580 0" keyTimes="0;0.38;1" dur="6.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="1" y="1" width="438" height="246" rx="12" fill="none" stroke="#dcdcd8" stroke-width="1.2"/>
  <line x1="16" y1="1.5" x2="424" y2="1.5" stroke="#ffffff" stroke-width="1" opacity="0.45"/>

  <text x="22" y="38" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="-0.3" fill="#0c0c0e">OpenBridge</text>
  <g transform="translate(355.8, 18)">
    <rect x="0" y="0" width="62.2" height="24" rx="6" fill="#f1f1ef" stroke="#dcdcd8" stroke-width="1"/><text x="31.1" y="16.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="600" fill="#3f3f46">v0.3.2</text>
  </g>

  <circle cx="27" cy="59" r="4" fill="#3572A5"/>
  <text x="37" y="63" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="600" fill="#3f3f46">Python · PolyForm Strict</text>

  <g transform="translate(362, 54)" opacity="0.85">
          <path d="M0 4 H18 L26 12 H44 M0 12 H44 M0 20 H18 L26 12" fill="none" stroke="#bdbdb7" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="0" cy="4" r="2.2" fill="#b45309"/>
          <circle cx="0" cy="12" r="2.2" fill="#0369a1"/>
          <circle cx="0" cy="20" r="2.2" fill="#15803d"/>
          <circle cx="44" cy="12" r="3" fill="#15803d"/>
          <circle cx="0" cy="12" r="2.2" fill="#15803d">
            <animate attributeName="cx" values="0;44;44" keyTimes="0;0.7;1" dur="3.4s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="3.4s" repeatCount="indefinite"/>
          </circle>
        </g>

  <text x="22" y="95" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#b45309">Multi-transport device automation</text>

  <text x="22" y="122" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#3f3f46">Connects uncooperative hardware over</text>
  <text x="22" y="142" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#3f3f46">mDNS, SSDP, ADB &amp; BLE; executes only</text>
  <text x="22" y="162" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#3f3f46">after validation, approval &amp; read-back.</text>

  <line x1="22" y1="188" x2="418" y2="188" stroke="#dcdcd8" stroke-width="1"/>
  <circle cx="28" cy="216" r="3.5" fill="#15803d"/>
  <text x="39" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="500" fill="#3f3f46">37/37 rows (28 HW · 7 VM · 2 Emu)</text>

  <g transform="translate(333.7, 204)">
    <rect x="0" y="0" width="84.3" height="24" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/><circle cx="12" cy="12.0" r="3.2" fill="#15803d"><animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></circle><text x="20.0" y="16.0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="600" fill="#15803d">CI GREEN</text>
  </g>
</svg>
